<h1>Help Centre: Fixing Google Calendar sync delays</h1>
<ol><li>Open TaskFlow Settings and go to Integrations.</li><li>Disconnect Google Calendar, wait one minute, then reconnect.</li><li>If tasks still take more than 15 minutes to appear, contact support with your workspace ID.</li></ol>
